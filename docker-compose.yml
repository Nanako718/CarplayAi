# CarPlay AI 智能助手 - Docker Compose
version: '3.8'

services:
  # 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carplay-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./data/carplay.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - MIMO_API_KEY=${MIMO_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://token-plan-sgp.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      - TTS_APP_ID=${TTS_APP_ID}
      - TTS_ACCESS_KEY=${TTS_ACCESS_KEY}
      - TTS_RESOURCE_ID=${TTS_RESOURCE_ID:-seed-tts-2.0}
      - TTS_DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-zh_female_xiaohe_uranus_bigtts}
      - AI_TIMEOUT=${AI_TIMEOUT:-30.0}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: carplay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    profiles:
      - production
