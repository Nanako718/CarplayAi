# CarPlay AI 智能助手 - Docker Compose
version: '3.8'

services:
  app:
    image: dtzsghnr/carplay-ai:latest
    container_name: carplay-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
