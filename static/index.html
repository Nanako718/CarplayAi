<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarPlay AI 智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #666;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .token-container {
            display: none;
            padding: 30px;
            text-align: center;
        }

        .token-box {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: #333;
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .info-box {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #004085;
        }

        .info-box h4 {
            margin-bottom: 10px;
            color: #004085;
        }

        .info-box code {
            background: #fff3cd;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }

        .shortcut-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .shortcut-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .shortcut-step {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .shortcut-step strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 CarPlay AI 智能助手</h1>
            <p>注册账号，开始智能出行体验</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">登录</div>
            <div class="tab" onclick="switchTab('register')">注册</div>
        </div>

        <div id="loginForm" class="form-container">
            <div id="loginMessage" class="message"></div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <button class="btn" onclick="login()">登 录</button>
        </div>

        <div id="registerForm" class="form-container" style="display: none;">
            <div id="registerMessage" class="message"></div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="3-50个字符">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="至少6个字符">
            </div>
            <div class="form-group">
                <label>昵称（可选）</label>
                <input type="text" id="regNickname" placeholder="给自己起个名字吧">
            </div>
            <button class="btn" onclick="register()">注 册</button>
        </div>

        <div id="tokenContainer" class="token-container">
            <h3>🎉 登录成功！</h3>
            <p>这是你的 API Token：</p>
            <div class="token-box" id="tokenValue"></div>
            <button class="copy-btn" onclick="copyToken()">📋 复制 Token</button>

            <div class="info-box">
                <h4>📱 快捷指令配置</h4>
                <p>在 iPhone 快捷指令中使用此 Token：</p>
                <p>1. 添加 HTTP 请求</p>
                <p>2. URL: <code>http://你的服务器IP:8000/api/v1/events</code></p>
                <p>3. 方法: <code>POST</code></p>
                <p>4. 请求头: <code>Authorization: Bearer {token}</code></p>
            </div>

            <div class="shortcut-section">
                <h3>📋 快速配置</h3>
                <div class="shortcut-step">
                    <strong>服务器地址：</strong><br>
                    <code id="serverUrl">http://localhost:8000</code>
                </div>
                <div class="shortcut-step">
                    <strong>你的 Token：</strong><br>
                    <code id="shortToken" style="font-size: 10px;"></code>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API 基础地址
        const API_BASE = window.location.origin;

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('tokenContainer').style.display = 'none';

            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginForm').style.display = 'block';
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        // 显示消息
        function showMessage(elementId, message, isError = true) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.className = `message ${isError ? 'error' : 'success'}`;
        }

        // 注册
        async function register() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const nickname = document.getElementById('regNickname').value;

            if (!username || !password) {
                showMessage('registerMessage', '请填写用户名和密码');
                return;
            }

            if (username.length < 3) {
                showMessage('registerMessage', '用户名至少3个字符');
                return;
            }

            if (password.length < 6) {
                showMessage('registerMessage', '密码至少6个字符');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, nickname })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('registerMessage', '注册成功！正在跳转...', false);
                    // 保存 token
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('userId', data.user_id);
                    // 显示 token
                    setTimeout(() => showToken(data.access_token), 1000);
                } else {
                    showMessage('registerMessage', data.detail || '注册失败');
                }
            } catch (error) {
                showMessage('registerMessage', '网络错误，请检查服务器');
            }
        }

        // 登录
        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showMessage('loginMessage', '请填写用户名和密码');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('loginMessage', '登录成功！', false);
                    // 保存 token
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('userId', data.user_id);
                    // 显示 token
                    setTimeout(() => showToken(data.access_token), 500);
                } else {
                    showMessage('loginMessage', data.detail || '登录失败');
                }
            } catch (error) {
                showMessage('loginMessage', '网络错误，请检查服务器');
            }
        }

        // 显示 Token
        function showToken(token) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('tokenContainer').style.display = 'block';
            document.getElementById('tokenValue').textContent = token;
            document.getElementById('shortToken').textContent = token.substring(0, 50) + '...';
            document.getElementById('serverUrl').textContent = API_BASE;
        }

        // 复制 Token
        function copyToken() {
            const token = document.getElementById('tokenValue').textContent;
            navigator.clipboard.writeText(token).then(() => {
                alert('Token 已复制到剪贴板！');
            }).catch(() => {
                //  fallback
                const textarea = document.createElement('textarea');
                textarea.value = token;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Token 已复制！');
            });
        }

        // 检查是否已登录
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                showToken(token);
            }
        };
    </script>
</body>
</html>
