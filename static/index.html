<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>CarPlay AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --blue: #007AFF;
            --blue-light: #E8F2FF;
            --green: #34C759;
            --red: #FF3B30;
            --gray-1: #8E8E93;
            --gray-2: #AEAEB2;
            --gray-3: #C7C7CC;
            --gray-4: #D1D1D6;
            --gray-5: #E5E5EA;
            --gray-6: #F2F2F7;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #000000;
            --text-secondary: #3C3C43;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Screens */
        .screen {
            display: none;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .screen.active {
            display: block;
        }

        /* ===== Login Screen ===== */
        .login-screen {
            background: var(--bg);
        }

        .login-header {
            padding: 80px 24px 40px;
        }

        .login-header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 17px;
            color: var(--gray-1);
        }

        .login-form {
            padding: 0 24px;
        }

        .input-group {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .input-row {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 44px;
            border-bottom: 0.5px solid var(--gray-5);
        }

        .input-row:last-child {
            border-bottom: none;
        }

        .input-row label {
            width: 64px;
            font-size: 17px;
            color: var(--text);
            flex-shrink: 0;
        }

        .input-row input {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-size: 17px;
            font-family: inherit;
            background: transparent;
        }

        .input-row input::placeholder {
            color: var(--gray-3);
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .login-btn:active {
            opacity: 0.8;
        }

        .login-btn:disabled {
            opacity: 0.5;
        }

        .login-footer {
            text-align: center;
            margin-top: 16px;
        }

        .login-footer a {
            color: var(--blue);
            font-size: 15px;
            text-decoration: none;
        }

        .login-msg {
            text-align: center;
            font-size: 15px;
            margin-bottom: 16px;
            min-height: 22px;
        }

        .login-msg.error { color: var(--red); }
        .login-msg.success { color: var(--green); }

        /* ===== Main Screen ===== */
        .main-screen {
            background: var(--bg);
        }

        .main-nav {
            background: var(--card);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid var(--gray-5);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .main-nav h2 {
            font-size: 17px;
            font-weight: 600;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            padding: 4px;
        }

        .main-content {
            padding: 20px 24px;
        }

        /* Token Card */
        .token-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .token-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .token-card-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .token-card-header button {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .token-value {
            background: var(--gray-6);
            border-radius: 8px;
            padding: 12px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 12px;
            word-break: break-all;
            color: var(--text-secondary);
            line-height: 1.5;
            max-height: 72px;
            overflow: hidden;
            position: relative;
        }

        .token-value::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: linear-gradient(transparent, var(--gray-6));
        }

        .copy-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .copy-toast.show {
            opacity: 1;
        }

        /* Info Cards */
        .info-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .info-card h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 0;
            border-top: 0.5px solid var(--gray-5);
        }

        .info-item:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .info-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            font-size: 16px;
        }

        .info-icon.blue { background: var(--blue-light); }
        .info-icon.green { background: #E8F9ED; }
        .info-icon.orange { background: #FFF3E0; }

        .info-text h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .info-text p {
            font-size: 13px;
            color: var(--gray-1);
            line-height: 1.4;
        }

        .info-text code {
            background: var(--gray-6);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 12px;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
        }

        .stat-card .label {
            font-size: 13px;
            color: var(--gray-1);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-card .sub {
            font-size: 12px;
            color: var(--gray-2);
            margin-top: 2px;
        }

        /* ===== Register Screen ===== */
        .register-screen {
            background: var(--bg);
        }

        .register-header {
            padding: 80px 24px 40px;
        }

        .register-header h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .register-header p {
            font-size: 17px;
            color: var(--gray-1);
        }

        .register-form {
            padding: 0 24px;
        }

        .register-footer {
            text-align: center;
            margin-top: 16px;
        }

        .register-footer a {
            color: var(--blue);
            font-size: 15px;
            text-decoration: none;
        }

        .register-msg {
            text-align: center;
            font-size: 15px;
            margin-bottom: 16px;
            min-height: 22px;
        }

        .register-msg.error { color: var(--red); }
        .register-msg.success { color: var(--green); }

        /* ===== Quick Actions ===== */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .action-card:active {
            transform: scale(0.98);
        }

        .action-card .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .action-card .title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .action-card .desc {
            font-size: 12px;
            color: var(--gray-1);
        }

        /* ===== Status Bar ===== */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
        }

        .status-text {
            font-size: 13px;
            color: var(--gray-1);
        }

        .status-text strong {
            color: var(--text);
        }

        /* Bottom Safe Area */
        .bottom-safe {
            height: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen login-screen active">
        <div class="login-header">
            <h1>CarPlay AI</h1>
            <p>登录你的账号</p>
        </div>
        <div class="login-form">
            <div id="loginMsg" class="login-msg"></div>
            <div class="input-group">
                <div class="input-row">
                    <label>用户名</label>
                    <input type="text" id="loginUser" placeholder="请输入" autocomplete="username">
                </div>
                <div class="input-row">
                    <label>密码</label>
                    <input type="password" id="loginPass" placeholder="请输入" autocomplete="current-password">
                </div>
            </div>
            <button class="login-btn" id="loginBtn" onclick="doLogin()">登录</button>
            <div class="login-footer">
                <a href="#" onclick="showRegister(); return false;">没有账号？立即注册</a>
            </div>
        </div>
    </div>

    <!-- Register Screen -->
    <div id="registerScreen" class="screen register-screen">
        <div class="register-header">
            <h1>注册</h1>
            <p>创建你的专属账号</p>
        </div>
        <div class="register-form">
            <div id="regMsg" class="register-msg"></div>
            <div class="input-group">
                <div class="input-row">
                    <label>用户名</label>
                    <input type="text" id="regUser" placeholder="3位以上" autocomplete="username">
                </div>
                <div class="input-row">
                    <label>密码</label>
                    <input type="password" id="regPass" placeholder="6位以上" autocomplete="new-password">
                </div>
                <div class="input-row">
                    <label>昵称</label>
                    <input type="text" id="regNick" placeholder="可选" autocomplete="nickname">
                </div>
            </div>
            <button class="login-btn" id="regBtn" onclick="doRegister()">注册</button>
            <div class="register-footer">
                <a href="#" onclick="showLogin(); return false;">已有账号？返回登录</a>
            </div>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="mainScreen" class="screen main-screen">
        <nav class="main-nav">
            <h2>CarPlay AI</h2>
            <button class="nav-btn" onclick="doLogout()">退出</button>
        </nav>

        <div class="main-content">
            <!-- Status -->
            <div class="status-bar">
                <div class="status-dot"></div>
                <div class="status-text">服务状态：<strong>运行中</strong></div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="label">用户ID</div>
                    <div class="value" id="userId">-</div>
                </div>
                <div class="stat-card">
                    <div class="label">登录状态</div>
                    <div class="value" style="font-size: 20px; color: var(--green);">已登录</div>
                </div>
            </div>

            <!-- Token -->
            <div class="token-card">
                <div class="token-card-header">
                    <h3>API Token</h3>
                    <button onclick="copyToken()">复制</button>
                </div>
                <div class="token-value" id="tokenDisplay"></div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <div class="action-card" onclick="window.open('/docs','_blank')">
                    <div class="icon">📖</div>
                    <div class="title">API 文档</div>
                    <div class="desc">查看接口说明</div>
                </div>
                <div class="action-card" onclick="window.open('/SHORTCUT_GUIDE.md','_blank')">
                    <div class="icon">📱</div>
                    <div class="title">快捷指令</div>
                    <div class="desc">配置指南</div>
                </div>
            </div>

            <!-- Info -->
            <div class="info-card">
                <h3>快捷指令配置</h3>
                <div class="info-item">
                    <div class="info-icon blue">1</div>
                    <div class="info-text">
                        <h4>添加 HTTP 请求</h4>
                        <p>URL: <code id="apiUrl">-</code></p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon green">2</div>
                    <div class="info-text">
                        <h4>设置请求头</h4>
                        <p>Authorization: <code>Bearer {token}</code></p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon orange">3</div>
                    <div class="info-text">
                        <h4>设置自动化</h4>
                        <p>CarPlay 连接时触发</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-safe"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="copy-toast">已复制</div>

    <script>
        const API = location.origin;

        // Screen switching
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showLogin() {
            showScreen('loginScreen');
        }

        function showRegister() {
            showScreen('registerScreen');
        }

        function showMain(token, userId) {
            document.getElementById('tokenDisplay').textContent = token;
            document.getElementById('userId').textContent = userId;
            document.getElementById('apiUrl').textContent = `${API}/api/v1/events`;
            showScreen('mainScreen');
        }

        // Login
        async function doLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');

            if (!u || !p) { msg.className = 'login-msg error'; msg.textContent = '请填写完整'; return; }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const res = await fetch(`${API}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('userId', data.user_id);
                    showMain(data.access_token, data.user_id);
                } else {
                    msg.className = 'login-msg error';
                    msg.textContent = data.detail || '登录失败';
                }
            } catch (e) {
                msg.className = 'login-msg error';
                msg.textContent = '网络错误';
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        // Register
        async function doRegister() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value;
            const n = document.getElementById('regNick').value.trim();
            const msg = document.getElementById('regMsg');

            if (!u || !p) { msg.className = 'register-msg error'; msg.textContent = '请填写用户名和密码'; return; }
            if (u.length < 3) { msg.className = 'register-msg error'; msg.textContent = '用户名至少3位'; return; }
            if (p.length < 6) { msg.className = 'register-msg error'; msg.textContent = '密码至少6位'; return; }

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const res = await fetch(`${API}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p, nickname: n || u })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('userId', data.user_id);
                    showMain(data.access_token, data.user_id);
                } else {
                    msg.className = 'register-msg error';
                    msg.textContent = data.detail || '注册失败';
                }
            } catch (e) {
                msg.className = 'register-msg error';
                msg.textContent = '网络错误';
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }

        // Logout
        function doLogout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            showScreen('loginScreen');
        }

        // Copy token
        function copyToken() {
            const token = document.getElementById('tokenDisplay').textContent;
            navigator.clipboard.writeText(token).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1500);
            });
        }

        // Init
        (function() {
            const token = localStorage.getItem('token');
            const userId = localStorage.getItem('userId');
            if (token && userId) {
                showMain(token, userId);
            } else {
                showScreen('loginScreen');
            }
        })();

        // Enter key
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const active = document.activeElement;
            if (active.closest('#loginScreen')) doLogin();
            if (active.closest('#registerScreen')) doRegister();
        });
    </script>
</body>
</html>
